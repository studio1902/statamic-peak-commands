{{#
    @name Text columns
    @desc The Text columns page builder block.
    @set page.page_builder.text_columns
#}}

<!-- /page_builder/_text_columns.antlers.html -->
{{ partial:page_builder/block }}
    <div class="span-content stack-2">
        {{ block:heading ?= { block:heading | wrap('h3.heading-size-2.md:max-w-[1/2]') } }}

        <article class="prose md:columns-2 gap-6 md:[&>ul]:inline-block md:[&>ul]:!mt-0 md:[&>ul]:mb-5 md:[&>ul]:break-inside-avoid md:[&>ol]:inline-block md:[&>ol]:!mt-0 md:[&>ol]:mb-5 md:[&>ol]:break-inside-avoid md:[&>p]:!mt-0">
            {{ block:text }}
        </article>
    </div>
{{ /partial:page_builder/block }}
<!-- End: /page_builder/_text_columns.antlers.html -->
